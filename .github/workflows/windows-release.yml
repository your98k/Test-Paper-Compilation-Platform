name: Windows native release

on:
  push:
    branches: [main]
    tags: ['windows-v*']
    paths:
      - 'windows/**'
      - '.github/workflows/windows-release.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache: false
      - name: Test native modules
        working-directory: windows
        run: go test -timeout 120s ./...
      - name: Validate version and build x64 payload
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import re;print(re.search(r"!define VERSION \"([^\"]+)\"",open("windows/setup/installer.nsi").read()).group(1))')
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "windows-v$version" ]]; then
            echo "Tag must match the installer version: windows-v$version" >&2
            exit 1
          fi
          mkdir -p dist/payload/amd64
          (cd windows && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags '-s -w -H windowsgui' -o ../dist/payload/amd64/K12QuestionBank.exe .)
      - name: Package installer and source archive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nsis
          sh windows/setup/package.sh dist/payload dist --x64
          git archive --format=zip --prefix=K12QuestionBank-Source/ HEAD > dist/K12QuestionBank-Source.zip
          cp windows/README.md 'dist/安装与使用.md'
          (cd dist && sha256sum K12QuestionBank-Setup.exe K12QuestionBank-Source.zip '安装与使用.md' > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          retention-days: 14
          path: |
            dist/K12QuestionBank-Setup.exe
            dist/K12QuestionBank-Source.zip
            dist/安装与使用.md
            dist/SHA256SUMS.txt
            dist/payload/amd64/K12QuestionBank.exe
          if-no-files-found: error

  windows-smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache: false
      - name: Test modules on Windows
        working-directory: windows
        run: go test -timeout 120s ./...
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: dist
      - name: Install, launch and uninstall native application
        shell: pwsh
        run: ./windows/setup/smoke.ps1 -DistDir ./dist

  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: [build, windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: dist
      - name: Publish versioned installer, source and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists; publish changes under a new version." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "组卷台 Windows ${RELEASE_TAG#windows-v}" \
            --notes-file windows/CHANGELOG.md \
            dist/K12QuestionBank-Setup.exe dist/K12QuestionBank-Source.zip \
            'dist/安装与使用.md' dist/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
